# worktrunk (wt) — git worktree manager
# https://worktrunk.dev/config/
#
# Herdr creates visible main/PR workspaces. Worktrunk isolates child writes only;
# creating or removing a child worktree never opens/closes a Herdr workspace.

# herdr が使うレイアウトに合わせる: ~/.herdr/worktrees/<repo>/<branch>
# herdr も worktrunk もブランチ名のスラッシュをダッシュに置換する
worktree-path = "~/.herdr/worktrees/{{ repo }}/{{ branch | sanitize }}"

