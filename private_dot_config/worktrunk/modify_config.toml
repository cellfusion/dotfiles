#!/usr/bin/env python3
"""Maintain shared Worktrunk defaults without overwriting private project rules."""
import json
import subprocess
import sys

BEGIN = '# chezmoi-worktrunk-managed-begin'
END = '# chezmoi-worktrunk-managed-end'
LEGACY = 'worktree-path = "~/.herdr/worktrees/{{ repo }}/{{ branch | sanitize }}"'
LEGACY_HEADER = '''# worktrunk (wt) — git worktree manager
# https://worktrunk.dev/config/
#
# Herdr creates visible main/PR workspaces. Worktrunk isolates child writes only;
# creating or removing a child worktree never opens/closes a Herdr workspace.

# herdr が使うレイアウトに合わせる: ~/.herdr/worktrees/<repo>/<branch>
# herdr も worktrunk もブランチ名のスラッシュをダッシュに置換する
''' + LEGACY + '\n'


def parse_toml(value):
    result = subprocess.run(
        ['chezmoi', 'execute-template', '--with-stdin', '{{ .chezmoi.stdin | fromToml | toJson }}'],
        input=value, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
    if result.returncode:
        raise ValueError('invalid Worktrunk TOML; preserve the file and correct its syntax')
    return json.loads(result.stdout)


def main():
    original = sys.stdin.read()
    if original.startswith(LEGACY_HEADER):
        original = original[len(LEGACY_HEADER):]
    lines = original.splitlines(keepends=True)
    begins = [i for i, line in enumerate(lines) if line.rstrip('\r\n') == BEGIN]
    ends = [i for i, line in enumerate(lines) if line.rstrip('\r\n') == END]
    if begins or ends:
        if len(begins) != 1 or len(ends) != 1 or begins[0] >= ends[0]:
            raise ValueError('invalid managed Worktrunk markers; preserve and repair the configuration')
        lines = lines[:begins[0]] + lines[ends[0] + 1:]
    else:
        # Migrate only the exact previously distributed top-level default.
        in_table = False
        for index, line in enumerate(lines):
            stripped = line.strip()
            if stripped.startswith('['):
                in_table = True
            if not in_table and stripped == LEGACY:
                del lines[index]
                break
    private = ''.join(lines).lstrip('\n')
    config = parse_toml(private)
    if 'pre-start' in config:
        raise ValueError('global pre-start conflicts with managed copy; move personal hooks under [projects]')
    if 'pre-switch' in config:
        raise ValueError('global pre-switch conflicts with managed approval check; move personal hooks under [projects]')
    if 'pre-remove' in config:
        raise ValueError('global pre-remove conflicts with managed approval check; move personal hooks under [projects]')
    removal = config.get('remove', {})
    if not isinstance(removal, dict):
        raise ValueError('invalid remove configuration')
    if 'remove' in config and removal.get('delete-branch') is not False:
        raise ValueError('set remove.delete-branch = false in the existing remove table')
    managed = [BEGIN, '# Shared defaults; personal [projects] settings below are preserved.']
    if 'worktree-path' not in config:
        managed.append('worktree-path = \"~/worktrees/{{ repo_path }}/{{ branch }}\"')
    managed.append('pre-switch = \"worktree-lifecycle check\"')
    managed.append('pre-start = \"worktree-lifecycle start\"')
    managed.append('pre-remove = \"worktree-lifecycle check\"')
    if 'remove' not in config:
        managed.append('remove.delete-branch = false')
    managed.append(END)
    output = '\n'.join(managed) + '\n' + private
    parse_toml(output)
    sys.stdout.write(output)


if __name__ == '__main__':
    try:
        main()
    except (ValueError, OSError) as error:
        print(f'worktrunk config: {error}', file=sys.stderr)
        sys.exit(1)
